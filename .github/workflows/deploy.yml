name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests with coverage
        run: npm test -- --coverage --coverage.reporter=json-summary --coverage.reporter=text-summary

      - name: End-to-end tests
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # GitHub Pages has no SPA fallback: serve index.html for unknown routes.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      # Published with the site and read by the shields.io badge in the README.
      - name: Coverage badge data
        run: node scripts/coverage-badge.js coverage/coverage-summary.json dist/coverage-badge.json

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
